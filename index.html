<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H | Ofertas</title>
<meta name="theme-color" content="#070b14">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { sun: '#ffb340', deep: '#070b14', navy: '#0d141f', edge: '#1b2a3d', glow: '#2f8fff' } } } };
</script>
<style>
  html { background: #070b14; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47,143,255,.15), transparent 70%),
      linear-gradient(180deg, #070b14 0%, #0a1220 50%, #070b14 100%);
    background-attachment: fixed;
  }

  /* Entrada en cascada */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 80ms); }

  /* Héroe con iluminación 3D en la imagen */
  .slide { grid-area: 1 / 1; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 1s; }
  .slide.on { opacity: 1; visibility: visible; }
  .prod { opacity: 0; transform: scale(1.35) translateX(7%); filter: blur(18px);
          transition: transform 1.4s cubic-bezier(.16,.8,.2,1), filter 1.2s ease, opacity .9s ease; }
  .slide.on .prod { opacity: 1; transform: none; filter: drop-shadow(0 0 40px rgba(47,143,255,0.45)); }
  .slide:not(.on) .prod { transform: scale(.94) translateX(-5%); filter: blur(10px); }
  .txt > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .slide.on .txt > * { opacity: 1; transform: none; }
  .slide.on .txt > :nth-child(1) { transition-delay: .35s; }
  .slide.on .txt > :nth-child(2) { transition-delay: .5s; }
  .slide.on .txt > :nth-child(3) { transition-delay: .65s; }
  .slide.on .txt > :nth-child(4) { transition-delay: .8s; }

  /* Resplandor azul detrás del producto */
  @keyframes pulse { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
  .halo { background: radial-gradient(circle, rgba(47,143,255,.5) 0%, rgba(30,90,200,.2) 40%, transparent 70%);
          filter: blur(15px); animation: pulse 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .float { animation: float 6s ease-in-out infinite; }

  /* Indicadores */
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .dot i { display: block; height: 100%; width: 0; background: #ffb340; }
  .dot.on i { animation: fill 5s linear forwards; }

  /* Menú Drawer Funcional */
  .drawer-overlay { opacity: 0; visibility: hidden; transition: opacity .3s ease; }
  .drawer-overlay.open { opacity: 1; visibility: visible; }
  .drawer-menu { transform: translateX(-100%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1); }
  .drawer-menu.open { transform: translateX(0); }

  /* Tarjetas sin márgenes y con hover nativo */
  .card { background: linear-gradient(180deg, #0f1826, #0b121d); border: 1px solid #1b2a3d;
          transition: border-color .4s ease, box-shadow .4s ease, transform .4s ease; 
          min-width: 180px; scroll-snap-align: start; }
  .card:hover { border-color: rgba(47,143,255,.6); box-shadow: 0 10px 40px -10px rgba(47,143,255,.4); transform: translateY(-4px); }
  
  /* Esconder la barra de scroll en móviles */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  a:focus-visible, button:focus-visible { outline: 2px solid #ffb340; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; }
    .halo, .float { animation: none; }
    .slide, .prod, .txt > *, .card, .card img { transition: none; }
    .prod { transform: none; filter: none; }
    .dot.on i { animation: none; width: 100%; }
  }
</style>
</head>
<body class="min-h-screen text-zinc-100 antialiased relative">

<!-- Drawer Overlay y Menú Lateral -->
<div id="drawer-overlay" class="drawer-overlay fixed inset-0 z-40 bg-deep/80 backdrop-blur-sm"></div>
<aside id="drawer-menu" class="drawer-menu fixed inset-y-0 left-0 z-50 w-72 border-r border-edge bg-deep p-6 shadow-2xl">
  <div class="flex items-center justify-between border-b border-edge/60 pb-5">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-sun shadow-[0_0_14px_3px_rgba(255,179,64,.55)]"></span>
      <span class="text-lg font-semibold tracking-tight text-white">Categorías</span>
    </div>
    <button id="close-menu" class="rounded-full p-2 text-zinc-400 hover:bg-edge/50 hover:text-white" aria-label="Cerrar menú">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <nav class="mt-6 flex flex-col gap-2">
    <a href="javascript:void(0)" class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-300 transition-colors hover:bg-edge/50 hover:text-sun">Accesorios para escritorio</a>
    <a href="javascript:void(0)" class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-300 transition-colors hover:bg-edge/50 hover:text-sun">Controles</a>
    <a href="javascript:void(0)" class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-300 transition-colors hover:bg-edge/50 hover:text-sun">Monitores</a>
    <a href="javascript:void(0)" class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-300 transition-colors hover:bg-edge/50 hover:text-sun">Accesorios para PC</a>
    <a href="javascript:void(0)" class="rounded-xl px-4 py-3 text-sm font-medium text-zinc-300 transition-colors hover:bg-edge/50 hover:text-sun">RAM / Memoria</a>
  </nav>
</aside>

<!-- Cabecera con Menú de Hamburguesa -->
<header class="rise sticky top-0 z-20 border-b border-edge/70 bg-deep/80 backdrop-blur-md" style="--i:0">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5">
    <div class="flex items-center gap-3.5">
      <button id="open-menu" class="p-1 text-zinc-300 transition hover:text-white active:scale-90" aria-label="Abrir menú">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-sun shadow-[0_0_14px_3px_rgba(255,179,64,.55)]"></span>
        <span class="text-lg font-semibold tracking-tight">H | Ofertas</span>
      </div>
    </div>
    <span class="text-xs text-zinc-400">Expiran pronto</span>
  </div>
  <div class="h-px w-full bg-edge/60" aria-hidden="true"><div id="dia" class="h-full bg-sun" style="width:0"></div></div>
</header>

<main class="mx-auto max-w-6xl px-4 pb-16 pt-4 overflow-hidden">

  <!-- Héroe -->
  <section class="rise relative overflow-hidden rounded-[2rem] border border-edge bg-deep/40 shadow-[inset_0_0_60px_rgba(0,0,0,0.5)]" style="--i:1" aria-roledescription="carrusel" aria-label="Ofertas destacadas">
    <div id="hero" class="grid"></div>
    <div id="dots" class="absolute inset-x-0 bottom-5 z-10 flex justify-center gap-2 md:justify-start md:px-12"></div>
  </section>

  <h3 class="rise mt-10 text-xl font-semibold tracking-tight text-white mb-4" style="--i:2">Catálogo Express</h3>

  <!-- Vitrina Scroll Horizontal (Swipe nativo para celular) -->
  <section id="grid" class="rise no-scrollbar flex gap-4 overflow-x-auto snap-x snap-mandatory pb-6" style="--i:3"></section>
</main>

<script>
(() => {
  const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const img = (txt, bg) => `https://placehold.co/800x800/${bg}/e8eef7?text=${encodeURIComponent(txt)}`;

  const P = [
    { t: 'Audífonos inalámbricos con cancelación activa de ruido y 40 h de batería', o: 1899, n: 1199, i: img('Audifonos', '101a2b') },
    { t: 'Monitor gamer curvo 27 pulgadas QHD a 165 Hz con panel VA', o: 5499, n: 3899, i: img('Monitor', '0f1829') },
    { t: 'Teclado mecánico compacto 75% inalámbrico con switches intercambiables', o: 1799, n: 1149, i: img('Teclado', '111c2e') },
    { t: 'Smartwatch con GPS, monitor de sueño y pantalla AMOLED', o: 2399, n: 1549, i: img('Smartwatch', '0e1727') },
    { t: 'Mouse ergonómico inalámbrico de 26,000 DPI y 70 h de autonomía', o: 1299, n: 799, i: img('Mouse', '121d30') },
    { t: 'Bocina Bluetooth portátil resistente al agua con graves profundos', o: 1599, n: 989, i: img('Bocina', '0d1626') }
  ];
  const H = [
    { p: 2, h: 'Escribe a otro nivel.' },
    { p: 1, h: 'Cada fotograma, más fluido.' },
    { p: 0, h: 'Tu música, sin el ruido.' }
  ];
  const off = p => Math.round((1 - p.n / p.o) * 100);

  // Lógica Menú Hamburguesa
  const btnOpen = document.getElementById('open-menu');
  const btnClose = document.getElementById('close-menu');
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('drawer-menu');
  const toggleMenu = () => { overlay.classList.toggle('open'); drawer.classList.toggle('open'); document.body.classList.toggle('overflow-hidden'); };
  btnOpen.addEventListener('click', toggleMenu);
  btnClose.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);

  // Héroe
  const hero = document.getElementById('hero'), dots = document.getElementById('dots');
  hero.innerHTML = H.map((s, k) => {
    const p = P[s.p];
    return `
    <article class="slide ${k === 0 ? 'on' : ''} grid items-center md:grid-cols-2" aria-hidden="${k !== 0}">
      <div class="relative order-1 flex aspect-[5/4] items-center justify-center md:order-2 md:aspect-square md:max-h-[500px]">
        <div class="halo absolute h-[90%] w-[90%] rounded-full"></div>
        <div class="float relative flex h-[80%] w-[80%] items-center justify-center">
          <img src="${p.i}" alt="" class="prod h-full w-full object-contain" ${k ? '' : 'fetchpriority="high"'}>
        </div>
      </div>
      <div class="txt order-2 px-6 pb-16 pt-2 md:order-1 md:px-12 md:pb-0">
        <h2 class="text-4xl font-bold leading-[1.05] tracking-tight md:text-6xl drop-shadow-md">${s.h}</h2>
        <p class="mt-3 line-clamp-2 max-w-md text-sm text-blue-100/70 md:text-base">${p.t}</p>
        <div class="mt-5 flex items-baseline gap-3">
          <span class="text-4xl font-bold text-sun drop-shadow-[0_0_15px_rgba(255,179,64,.4)]">${mxn.format(p.n)}</span>
          <span class="text-lg text-blue-200/30 line-through">${mxn.format(p.o)}</span>
          <span class="rounded-full bg-sun/15 px-3 py-1 text-sm font-semibold text-sun border border-sun/20">-${off(p)}%</span>
        </div>
        <a href="javascript:void(0)" class="mt-7 inline-block rounded-full bg-sun px-8 py-3.5 text-sm font-bold text-deep shadow-[0_0_25px_-4px_rgba(255,179,64,.6)] transition duration-300 hover:scale-105 active:scale-95">Comprar con descuento</a>
      </div>
    </article>`;
  }).join('');
  dots.innerHTML = H.map((_, k) => `<button class="dot ${k === 0 ? 'on' : ''} h-1.5 w-10 overflow-hidden rounded-full bg-edge" aria-label="Oferta ${k + 1}"><i></i></button>`).join('');

  const slides = [...hero.children], ds = [...dots.children];
  let cur = 0, timer;
  function go(k) {
    slides[cur].classList.remove('on'); slides[cur].setAttribute('aria-hidden', 'true'); ds[cur].classList.remove('on');
    cur = k;
    slides[cur].classList.add('on'); slides[cur].setAttribute('aria-hidden', 'false');
    void ds[cur].offsetWidth; ds[cur].classList.add('on');
  }
  function start() { clearInterval(timer); timer = setInterval(() => go((cur + 1) % slides.length), 5000); }
  ds.forEach((d, k) => d.addEventListener('click', () => { go(k); start(); }));
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : (go(cur), start()));
  start();

  // Vitrina (Scroll Horizontal, sin márgenes, hover fluido)
  document.getElementById('grid').innerHTML = P.map((p, k) => `
    <article class="card flex flex-col rounded-2xl overflow-hidden w-[220px] md:w-[260px] shrink-0">
      <a href="javascript:void(0)" class="relative block bg-deep/50 aspect-[4/3] overflow-hidden" tabindex="-1" aria-hidden="true">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(47,143,255,0.15)_0%,transparent_70%)] opacity-0 transition-opacity duration-500 group-hover:opacity-100 z-0"></div>
        <img src="${p.i}" alt="" loading="lazy" class="relative z-10 h-full w-full object-cover transition duration-500 ease-out hover:scale-105">
        <span class="absolute left-3 top-3 z-20 rounded-full bg-deep/90 px-2.5 py-1 text-xs font-semibold text-sun backdrop-blur border border-edge/50">-${off(p)}%</span>
      </a>
      <div class="flex flex-1 flex-col p-4 pt-3">
        <h3 class="line-clamp-2 min-h-[2.5rem] text-sm leading-5 text-zinc-200">${p.t}</h3>
        <div class="mt-2 flex items-baseline gap-2">
          <span class="text-lg font-semibold text-sun drop-shadow-[0_0_10px_rgba(255,179,64,.35)]">${mxn.format(p.n)}</span>
          <span class="text-xs text-zinc-500 line-through">${mxn.format(p.o)}</span>
        </div>
        <a href="javascript:void(0)" class="mt-4 block w-full rounded-full bg-sun py-2 text-center text-sm font-bold text-deep transition duration-300 hover:brightness-110 active:scale-95 shadow-[0_0_15px_-5px_rgba(255,179,64,.4)]">Aprovechar</a>
      </div>
    </article>`).join('');

  // Barra avance día
  const d = new Date(); document.getElementById('dia').style.width = (((d.getHours() * 60 + d.getMinutes()) / 1440) * 100).toFixed(1) + '%';
})();
</script>
</body>
</html>
