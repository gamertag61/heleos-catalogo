<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H | Ofertas</title>
<meta name="theme-color" content="#070b14">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { sun: '#ffb340', deep: '#070b14', navy: '#0d141f', edge: '#1b2a3d', glow: '#2f8fff' } } } };
</script>
<style>
  html { background: #070b14; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    background:
      radial-gradient(ellipse 80% 40% at 50% -5%, rgba(47,143,255,.14), transparent 70%),
      linear-gradient(180deg, #070b14 0%, #0a1220 50%, #070b14 100%);
    background-attachment: fixed;
  }

  /* Entrada en cascada */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 80ms); }

  /* Héroe: el producto entra desenfocado y grande, y se asienta (como en el video) */
  .slide { grid-area: 1 / 1; opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 1s; }
  .slide.on { opacity: 1; visibility: visible; }
  .prod { opacity: 0; transform: scale(1.35) translateX(7%); filter: blur(18px);
          transition: transform 1.4s cubic-bezier(.16,.8,.2,1), filter 1.2s ease, opacity .9s ease; }
  .slide.on .prod { opacity: 1; transform: none; filter: none; }
  .slide:not(.on) .prod { transform: scale(.94) translateX(-5%); filter: blur(10px); }
  .txt > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  .slide.on .txt > * { opacity: 1; transform: none; }
  .slide.on .txt > :nth-child(1) { transition-delay: .35s; }
  .slide.on .txt > :nth-child(2) { transition-delay: .5s; }
  .slide.on .txt > :nth-child(3) { transition-delay: .65s; }
  .slide.on .txt > :nth-child(4) { transition-delay: .8s; }

  /* Resplandor azul detrás del producto, con pulso lento */
  @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  .halo { background: radial-gradient(circle, rgba(47,143,255,.62) 0%, rgba(30,90,200,.28) 38%, transparent 68%);
          filter: blur(8px); animation: pulse 5s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .float { animation: float 6s ease-in-out infinite; }

  /* Indicadores con progreso de 5 s */
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  .dot i { display: block; height: 100%; width: 0; background: #ffb340; }
  .dot.on i { animation: fill 5s linear forwards; }

  /* Cinta de categorías */
  @keyframes marquee { to { transform: translateX(-50%); } }
  .marquee { animation: marquee 32s linear infinite; }

  /* Tarjetas con borde azul que se enciende */
  .card { background: linear-gradient(180deg, #0f1826, #0b121d); border: 1px solid #1b2a3d;
          transition: border-color .4s ease, box-shadow .4s ease, transform .4s ease; }
  .card:hover { border-color: rgba(47,143,255,.55); box-shadow: 0 0 34px -8px rgba(47,143,255,.55); transform: translateY(-3px); }

  a:focus-visible, button:focus-visible { outline: 2px solid #ffb340; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; }
    .halo, .float, .marquee { animation: none; }
    .slide, .prod, .txt > *, .card, .card img { transition: none; }
    .prod { transform: none; filter: none; }
    .dot.on i { animation: none; width: 100%; }
  }
</style>
</head>
<body class="min-h-screen text-zinc-100 antialiased">

<!-- Cabecera -->
<header class="rise sticky top-0 z-20 border-b border-edge/70 bg-deep/80 backdrop-blur-md" style="--i:0">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5">
    <div class="flex items-center gap-2.5">
      <span class="h-2.5 w-2.5 rounded-full bg-sun shadow-[0_0_14px_3px_rgba(255,179,64,.55)]"></span>
      <span class="text-lg font-semibold tracking-tight">H | Ofertas</span>
    </div>
    <span class="text-xs text-zinc-400">Expiran pronto</span>
  </div>
  <div class="h-px w-full bg-edge/60" aria-hidden="true"><div id="dia" class="h-full bg-sun" style="width:0"></div></div>
</header>

<main class="mx-auto max-w-6xl px-4 pb-16 pt-4">

  <!-- Héroe -->
  <section class="rise relative overflow-hidden rounded-[2rem] border border-edge bg-deep/60" style="--i:1" aria-roledescription="carrusel" aria-label="Ofertas destacadas">
    <div id="hero" class="grid"></div>
    <div id="dots" class="absolute inset-x-0 bottom-4 z-10 flex justify-center gap-2 md:justify-start md:px-12"></div>
  </section>

  <!-- Cinta -->
  <div class="rise mt-6 overflow-hidden border-y border-edge/60 py-3 text-sm text-zinc-400" style="--i:2" aria-hidden="true">
    <div class="marquee flex w-max gap-8 whitespace-nowrap">
      <span id="m1" class="flex gap-8"></span><span id="m2" class="flex gap-8"></span>
    </div>
  </div>

  <!-- Vitrina -->
  <section id="grid" class="mt-8 grid grid-cols-2 gap-3 sm:gap-5 md:grid-cols-3 lg:grid-cols-4"></section>
</main>

<script>
(() => {
  const mxn = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const img = (txt, bg) => `https://placehold.co/800x800/${bg}/e8eef7?text=${encodeURIComponent(txt)}`;

  // Reemplaza las imágenes por fotos reales (de preferencia con fondo transparente en el héroe)
  const P = [
    { t: 'Audífonos inalámbricos con cancelación activa de ruido y 40 h de batería', o: 1899, n: 1199, i: img('Audifonos', '101a2b') },
    { t: 'Monitor gamer curvo 27 pulgadas QHD a 165 Hz con panel VA', o: 5499, n: 3899, i: img('Monitor', '0f1829') },
    { t: 'Teclado mecánico compacto 75% inalámbrico con switches intercambiables', o: 1799, n: 1149, i: img('Teclado', '111c2e') },
    { t: 'Smartwatch con GPS, monitor de sueño y pantalla AMOLED', o: 2399, n: 1549, i: img('Smartwatch', '0e1727') },
    { t: 'Mouse ergonómico inalámbrico de 26,000 DPI y 70 h de autonomía', o: 1299, n: 799, i: img('Mouse', '121d30') },
    { t: 'Bocina Bluetooth portátil resistente al agua con graves profundos', o: 1599, n: 989, i: img('Bocina', '0d1626') }
  ];
  const H = [
    { p: 2, h: 'Escribe a otro nivel.' },
    { p: 1, h: 'Cada fotograma, más fluido.' },
    { p: 0, h: 'Tu música, sin el ruido.' }
  ];
  const off = p => Math.round((1 - p.n / p.o) * 100);

  // Héroe
  const hero = document.getElementById('hero'), dots = document.getElementById('dots');
  hero.innerHTML = H.map((s, k) => {
    const p = P[s.p];
    return `
    <article class="slide ${k === 0 ? 'on' : ''} grid items-center md:grid-cols-2" aria-hidden="${k !== 0}">
      <div class="relative order-1 flex aspect-[5/4] items-center justify-center md:order-2 md:aspect-square md:max-h-[500px]">
        <div class="halo absolute h-[85%] w-[85%] rounded-full"></div>
        <div class="float relative h-[78%] w-[78%]">
          <img src="${p.i}" alt="" class="prod h-full w-full rounded-3xl object-cover shadow-[0_30px_80px_-20px_rgba(0,0,0,.8)]" ${k ? '' : 'fetchpriority="high"'}>
        </div>
      </div>
      <div class="txt order-2 px-6 pb-14 pt-2 md:order-1 md:px-12 md:pb-0">
        <h2 class="text-4xl font-semibold leading-[1.05] tracking-tight md:text-6xl">${s.h}</h2>
        <p class="mt-3 line-clamp-2 max-w-md text-sm text-zinc-400 md:text-base">${p.t}</p>
        <div class="mt-4 flex items-baseline gap-3">
          <span class="text-3xl font-semibold text-sun">${mxn.format(p.n)}</span>
          <span class="text-zinc-500 line-through">${mxn.format(p.o)}</span>
          <span class="rounded-full bg-sun/15 px-2.5 py-0.5 text-xs font-semibold text-sun">-${off(p)}%</span>
        </div>
        <a href="#" class="mt-5 inline-block rounded-full bg-sun px-7 py-3 text-sm font-semibold text-deep shadow-[0_0_28px_-4px_rgba(255,179,64,.6)] transition hover:brightness-110 active:scale-95">Comprar con descuento</a>
      </div>
    </article>`;
  }).join('');
  dots.innerHTML = H.map((_, k) =>
    `<button class="dot ${k === 0 ? 'on' : ''} h-1 w-9 overflow-hidden rounded-full bg-edge" aria-label="Oferta ${k + 1}"><i></i></button>`).join('');

  const slides = [...hero.children], ds = [...dots.children];
  let cur = 0, timer;
  function go(k) {
    slides[cur].classList.remove('on'); slides[cur].setAttribute('aria-hidden', 'true'); ds[cur].classList.remove('on');
    cur = k;
    slides[cur].classList.add('on'); slides[cur].setAttribute('aria-hidden', 'false');
    void ds[cur].offsetWidth;
    ds[cur].classList.add('on');
  }
  function start() { clearInterval(timer); timer = setInterval(() => go((cur + 1) % slides.length), 5000); }
  ds.forEach((d, k) => d.addEventListener('click', () => { go(k); start(); }));
  document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : (go(cur), start()));
  start();

  // Cinta
  const cats = ['Audífonos', 'Monitores', 'Teclados', 'Smartwatch', 'Mouse', 'Bocinas', 'Gaming', 'Accesorios'];
  const cinta = cats.map(c => `<span class="flex items-center gap-8">${c}<i class="h-1 w-1 rounded-full bg-glow"></i></span>`).join('');
  document.getElementById('m1').innerHTML = cinta; document.getElementById('m2').innerHTML = cinta;

  // Vitrina
  document.getElementById('grid').innerHTML = P.map((p, k) => `
    <article class="card rise group flex flex-col rounded-3xl p-2" style="--i:${k + 4}">
      <a href="#" class="relative block overflow-hidden rounded-2xl" tabindex="-1" aria-hidden="true">
        <img src="${p.i}" alt="" loading="lazy" class="aspect-square w-full object-cover transition duration-500 ease-out group-hover:scale-105">
        <span class="absolute left-2.5 top-2.5 rounded-full bg-deep/80 px-2.5 py-1 text-xs font-semibold text-sun backdrop-blur">-${off(p)}%</span>
      </a>
      <h3 class="mt-3 line-clamp-2 min-h-[2.5rem] px-2 text-sm leading-5 text-zinc-200">${p.t}</h3>
      <div class="mt-2 flex items-baseline gap-2 px-2">
        <span class="text-lg font-semibold text-sun drop-shadow-[0_0_10px_rgba(255,179,64,.35)]">${mxn.format(p.n)}</span>
        <span class="text-sm text-zinc-500 line-through">${mxn.format(p.o)}</span>
      </div>
      <a href="#" class="mx-1 mb-1 mt-3 block rounded-full bg-sun py-2.5 text-center text-sm font-semibold text-deep transition hover:brightness-110 active:scale-95">Aprovechar oferta</a>
    </article>`).join('');

  // Barra sutil: avance del día
  const d = new Date();
  document.getElementById('dia').style.width = (((d.getHours() * 60 + d.getMinutes()) / 1440) * 100).toFixed(1) + '%';
})();
</script>
</body>
</html>
